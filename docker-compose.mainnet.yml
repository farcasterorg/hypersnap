services:
  hypersnap:
    image: farcasterorg/hypersnap:latest
    pull_policy: always
    #    build: # For testing
    #      context: .
    #      dockerfile: Dockerfile
    init: true # Auto-reap zombie processes and forward process signals
    environment:
      RUST_BACKTRACE: "full"
      # The node config. The entrypoint writes it to config.toml. It lives here
      # rather than in the entrypoint because docker-init, the container's first
      # process, keeps the entrypoint in its arguments while the container runs,
      # and `ps` shows process arguments to every user on the host.
      # Compose substitutes ${VAR} in this text: write a literal $ as $$.
      HYPERSNAP_CONFIG: |
        rpc_address="0.0.0.0:3383"
        http_address="0.0.0.0:3381"
        rocksdb_dir=".rocks"
        fc_network="Mainnet"
        read_node = true

        [statsd]
        prefix="snapchain"
        addr="statsd:8125"
        use_tags=true

        [gossip]
        address="/ip4/0.0.0.0/udp/3382/quic-v1"
        bootstrap_peers = "/ip4/54.236.164.51/udp/3382/quic-v1, /ip4/54.87.204.167/udp/3382/quic-v1, /ip4/44.197.255.20/udp/3382/quic-v1, /ip4/54.157.62.17/udp/3382/quic-v1, /ip4/34.195.157.114/udp/3382/quic-v1, /ip4/107.20.169.236/udp/3382/quic-v1, /ip4/35.212.102.55/udp/3382/quic-v1, /ip4/35.157.151.56/udp/3382/quic-v1, /ip4/108.132.114.186/udp/3382/quic-v1"

        [consensus]
        shard_ids = [1,2]
        num_shards = 2

        [hyper]
        enabled = true

        [api]
        enabled = true

        [api.social_graph]
        enabled = true
        backfill_on_startup = true

        [api.channels]
        enabled = true
        backfill_on_startup = true

        [api.metrics]
        enabled = true
        backfill_on_startup = true

        [api.feeds]
        enabled = true

        [api.search]
        enabled = true
        backfill_on_startup = true
        index_path = ".rocks/search_index"

        [api.conversations]
        enabled = true

        [snapshot]
        endpoint_url = "https://e1f9f185c6e63471dd39f96abd3413c4.r2.cloudflarestorage.com"
        load_db_from_snapshot=true
    # Writes HYPERSNAP_CONFIG to config.toml, appends the validator sets from the
    # dedicated validators.toml file, then runs the command. See validators.toml
    # for the full history of validator changes and operator details. It unsets
    # HYPERSNAP_CONFIG first, so the node's environment holds no copy. Keep this
    # line short, for the reason given above HYPERSNAP_CONFIG.
    entrypoint:
      - "/bin/bash"
      - "-c"
      - 'set -euo pipefail; printf "%s\n" "$$HYPERSNAP_CONFIG" > config.toml; unset HYPERSNAP_CONFIG; cat /app/validators.toml >> config.toml; exec "$$0" "$$@"'
    command: [ "./hypersnap", "--config-path", "config.toml" ]
    depends_on:
      # Ensures statsd is registered with the DNS resolver before the node
      # resolves its metrics address. service_started is enough: the name is
      # published at container start, not at healthcheck pass.
      statsd:
        condition: service_started
    restart: always
    ports:
      - "3381:3381/tcp"
      - "3382:3382/udp"
      - "3383:3383/tcp"
    volumes:
      - .rocks:/app/.rocks
      - .rocks.snapshot:/app/.rocks.snapshot
      - ./validators.toml:/app/validators.toml:ro
    networks:
      - hypersnap
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  # Start this if you want perf metrics for your hubble node. Remember to start `grafana` as well.
  statsd:
    image: graphiteapp/graphite-statsd:1.1.10-5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-zv", "localhost", "8126"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
    ports:
      # - '80:80' # Graphite web
      # - '2003:2003' # Carbon line receiver
      # - '2004:2004' # Carbon pickle receiver
      # - '7002:7002' # Carbon cache query
      - '${STATSD_PUBLISH:-8125}:8125/udp' # StatsD
      - '${STATSD_ADMIN_PUBLISH:-8126}:8126' # StatsD admin
    networks:
      - hypersnap

  # Start this if you want to see perf metrics for your hubble node. Remember to start `statsd` as well.
  grafana:
    image: grafana/grafana:10.0.3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
    # Mount the grafana config file
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/data:/var/lib/grafana  # Persistent Grafana data
    ports:
      - '3000:3000' # Grafana web
    networks:
      - hypersnap

networks:
  hypersnap:
    driver: bridge
