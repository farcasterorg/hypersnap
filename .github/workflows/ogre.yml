name: Ogre

# Rolls this build onto a 10-node devnet seeded with real mainnet accounts, the
# way a release reaches mainnet, and checks the network keeps working: blocks,
# every read endpoint, and new messages landing everywhere. See docs/ogre.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * *" # a fresh seed, and a chain on the newest release, daily
  workflow_dispatch:

permissions:
  contents: read

# The nightly seed refresh has its own group, so a merge doesn't cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The same as Verify's, so this build reuses Verify's caches.
env:
  RUSTFLAGS: "-Dwarnings -A mismatched_lifetime_syntaxes"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # The release mainnet runs, which the devnet starts on.
  BASE_IMAGE: farcasterorg/hypersnap:latest
  # Mainnet node the seed is exported from.
  SEED_SOURCE: https://haatz.quilibrium.com

jobs:
  rollout:
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write # main deletes the Ogre caches it supersedes
    runs-on: ${{ vars.RUNS_ON == 'true' && fromJSON(format('["runs-on={0}","runner=64cpu-linux-arm64"]', github.run_id)) || 'ubuntu-24.04-arm' }}
    steps:
      - name: Start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          path: ./snapchain
          persist-credentials: false

      - uses: rui314/setup-mold@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: snapchain
          shared-key: verify
          save-if: false

      - name: Restore incremental build
        uses: actions/cache/restore@v4
        with:
          path: snapchain/target/debug/incremental
          key: incremental-${{ runner.arch }}-${{ hashFiles('snapchain/rust-toolchain.toml', 'snapchain/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            incremental-${{ runner.arch }}-${{ hashFiles('snapchain/rust-toolchain.toml', 'snapchain/Cargo.lock') }}-
            incremental-${{ runner.arch }}-

      # Pulled while the build runs.
      - name: Pull the base release
        id: base
        run: |
          (for i in 1 2 3; do docker pull -q "$BASE_IMAGE" && exit 0; sleep 10; done; exit 1) > pull.log 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ./snapchain
        env:
          CARGO_INCREMENTAL: "1"
        run: cargo build --profile test --bin hypersnap --bin ogre

      - name: Base release digest
        id: digest
        run: |
          while kill -0 ${{ steps.base.outputs.pid }} 2>/dev/null; do sleep 1; done
          cat pull.log
          image=$(docker inspect --format '{{index .RepoDigests 0}}' "$BASE_IMAGE")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "sha=${image##*:}" >> "$GITHUB_OUTPUT"

      # A change to the exporter exports a new seed; the nightly always does.
      - name: Restore the seed
        id: seed
        uses: actions/cache/restore@v4
        with:
          path: ogre/seed.bin
          key: ogre-seed-v2-${{ hashFiles('snapchain/src/bin/ogre/seed.rs', 'snapchain/src/bin/ogre/convert.rs') }}-${{ github.run_id }}
          restore-keys: ${{ github.event_name != 'schedule' && format('ogre-seed-v2-{0}-', hashFiles('snapchain/src/bin/ogre/seed.rs', 'snapchain/src/bin/ogre/convert.rs')) || '' }}

      - name: Export a seed from mainnet
        if: steps.seed.outputs.cache-matched-key == ''
        run: |
          mkdir -p ogre
          snapchain/target/debug/ogre seed --source "$SEED_SOURCE" --out ogre/seed.bin

      - name: Restore the seeded chain
        id: chain
        uses: actions/cache/restore@v4
        with:
          path: ogre/chain
          # Any change to Ogre but its list of accepted differences rebuilds the chain.
          key: ogre-chain-v1-${{ steps.digest.outputs.sha }}-${{ hashFiles('ogre/seed.bin', 'snapchain/src/bin/ogre/**', '!snapchain/src/bin/ogre/accepted.txt') }}

      - name: Build the seeded chain on the base release
        if: steps.chain.outputs.cache-hit != 'true'
        env:
          IMAGE: ${{ steps.digest.outputs.image }}
        run: |
          snapchain/target/debug/ogre chain --seed ogre/seed.bin \
            --base "docker:$IMAGE" \
            --work ogre/chain --report "$GITHUB_STEP_SUMMARY"

      - name: Roll out
        env:
          IMAGE: ${{ steps.digest.outputs.image }}
        run: |
          cp -a ogre/chain ogre/run
          snapchain/target/debug/ogre run --seed ogre/seed.bin \
            --base "docker:$IMAGE" \
            --under-test snapchain/target/debug/hypersnap \
            --work ogre/run --report "$GITHUB_STEP_SUMMARY"

      # Only a seed and chain that passed a rollout are reused, so one that
      # can't doesn't fail later runs. Only main and the nightly save them: a
      # chain is ~285 MiB, and pull requests' copies pushed the repo's caches
      # over quota, evicting Verify's. A pull request that changes Ogre's code
      # rebuilds the chain on each run (about 4.5 minutes).
      - name: Save the seeded chain
        if: steps.chain.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ogre/chain
          key: ${{ steps.chain.outputs.cache-primary-key }}

      - name: Save the seed
        if: steps.seed.outputs.cache-matched-key == '' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ogre/seed.bin
          key: ${{ steps.seed.outputs.cache-primary-key }}

      - name: Node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ogre-logs
          path: |
            ogre/chain/logs
            ogre/run/logs
          retention-days: 7

      # Only caches older than this run: a nightly running alongside keeps its own.
      - name: Delete superseded Ogre caches
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ steps.seed.outputs.cache-matched-key || steps.seed.outputs.cache-primary-key }}
          CHAIN: ${{ steps.chain.outputs.cache-primary-key }}
          START: ${{ steps.start.outputs.at }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key ogre- --ref refs/heads/main --limit 100 --json key,createdAt \
            --jq '.[] | select(.createdAt < env.START) | .key' |
            grep -vx -e "$SEED" -e "$CHAIN" | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
