name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MALACHITE_GIT_REF: "13bca14cd209d985c3adf101a02924acde8723a5"
  ETH_SIGNATURE_VERIFIER_GIT_REF: "8deb4a091982c345949dc66bf8684489d9f11889"
  RUSTFLAGS: "-Dwarnings -A mismatched_lifetime_syntaxes"
  CARGO_TERM_COLOR: always

# GitHub-hosted arm64 runners by default. Setting the repository variable
# RUNS_ON to "true" puts the jobs back on the RunsOn 64-CPU runners.
jobs:
  fmt:
    timeout-minutes: 10
    runs-on: ${{ vars.RUNS_ON == 'true' && fromJSON(format('["runs-on={0}","runner=64cpu-linux-arm64"]', github.run_id)) || 'ubuntu-24.04-arm' }}
    steps:
      # cargo reads the workspace's path dependencies even to format it
      - uses: actions/checkout@v4
        with:
          repository: informalsystems/malachite
          ref: ${{ env.MALACHITE_GIT_REF }}
          path: ./malachite
      - uses: actions/checkout@v4
        with:
          repository: CassOnMars/eth-signature-verifier
          ref: ${{ env.ETH_SIGNATURE_VERIFIER_GIT_REF }}
          path: ./eth-signature-verifier
      - uses: actions/checkout@v4
        with:
          path: ./snapchain
      # rustup installs the toolchain rust-toolchain.toml pins
      - working-directory: ./snapchain
        run: cargo fmt --all --check

  test:
    timeout-minutes: 60
    runs-on: ${{ vars.RUNS_ON == 'true' && fromJSON(format('["runs-on={0}","runner=64cpu-linux-arm64"]', github.run_id)) || 'ubuntu-24.04-arm' }}
    steps:
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: informalsystems/malachite
          ref: ${{ env.MALACHITE_GIT_REF }}
          path: ./malachite
      - uses: actions/checkout@v4
        with:
          repository: CassOnMars/eth-signature-verifier
          ref: ${{ env.ETH_SIGNATURE_VERIFIER_GIT_REF }}
          path: ./eth-signature-verifier
      - uses: actions/checkout@v4
        with:
          path: ./snapchain

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Dependencies (and malachite) come from the cache, so a PR only
      # recompiles snapchain itself. Only main saves, so PRs can't evict it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: snapchain
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - working-directory: ./snapchain
        run: cargo test

      - working-directory: ./snapchain
        run: cargo build --bins

      - working-directory: ./snapchain/tests/client_parity_tests
        run: |
          npx node-gyp@12.2.0 install
          yarn install

      - working-directory: ./snapchain/tests/client_parity_tests
        run: yarn test
