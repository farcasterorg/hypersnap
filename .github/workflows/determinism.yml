name: Determinism

# R1 test gate 2: the consensus arithmetic gives bit-identical results on
# x86_64 Linux, aarch64 Linux and aarch64 macOS. The PoQ golden vectors
# (`proof-of-quality`), the Keccak trie vectors (`hypersnap-ktrie`) and the
# Falcon-512 KATs (`hypersnap-falcon`) pin the outputs, so each platform runs
# them against the same values.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vectors:
    name: vectors (${{ matrix.platform }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            os: ubuntu-24.04
          - platform: aarch64-linux
            os: ubuntu-24.04-arm
          - platform: aarch64-macos
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      # Malachite comes from the checked-in vendor directory.

      - uses: actions/checkout@v4
        with:
          path: ./snapchain

      # Must stay in step with rust-toolchain.toml and verify.yml.
      - name: Install Rust 1.95.0
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.95.0
          profile: minimal
          override: true

      - working-directory: ./snapchain
        run: cargo test --locked -p proof-of-quality -p hypersnap-ktrie -p hypersnap-falcon
