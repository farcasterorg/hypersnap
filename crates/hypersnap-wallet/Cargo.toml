[package]
name = "hypersnap-wallet"
version = "0.1.0"
edition = "2021"
description = "Hypersnap wallet SDK — transaction builders, stealth scanning, and node client"

[dependencies]
hypersnap-crypto = { path = "../hypersnap-crypto" }
hypersnap-proto = { path = "../../proto" }
ed25519-dalek = { version = "2.1.1", features = ["batch"] }
reqwest = { version = "0.12.9", features = ["json"] }
prost = "0.13.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4.3"
thiserror = "1.0"
tokio = { version = "1.40.0", features = ["rt", "macros"] }
rand = "0.8.5"
sha2 = "0.10"
alloy-primitives = "0.8.14"
