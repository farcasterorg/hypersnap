# listen = "/ip4/0.0.0.0/udp/0/quic-v1"
# A FIRST launch before the fork reserves the fork block; after it, tip + 1.
# Both directions wait for each Hypersnap shard's fork before relaying.
# To replay retained post-fork history, set inclusive starting blocks per shard:
# [hypersnap.start_blocks]
# "0" = 50477529
# "1" = 51161786
# "2" = 50996940

[snapchain]
rpc = "http://snap.farcaster.xyz:3383"
# Public Snapchain validator RPC; used if the primary cannot answer GetInfo.
rpc_fallbacks = ["http://107.20.169.236:3383"]
peers = ["/dns4/snap.farcaster.xyz/udp/3382/quic-v1"]
# Optional allowlist on either side: only the intersection is relayed.
# This is the binary default; 16/17 are gasless KEY_ADD/KEY_REMOVE.
# Feature-gated types still have to pass the destination's validation.
# message_types = [1, 2, 3, 4, 5, 6, 7, 8, 11, 12, 13, 14, 15, 16, 17]
