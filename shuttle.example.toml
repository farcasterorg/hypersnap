# Copy to shuttle.toml. Use gRPC RPC addresses, not REST API addresses.
state_dir = ".shuttle"
network = 1 # Farcaster Mainnet message signatures on both networks
num_shards = 2
shards = [0, 1, 2]
poll_ms = 500
batch_blocks = 16
rpc_timeout_secs = 15

# Must match validators.toml on the Hypersnap nodes.
[topic_cutovers]
"0" = 50_477_529
"1" = 51_161_786
"2" = 50_996_940

[hypersnap]
# haatz (cassie): direct gRPC origin, rather than the HTTPS API proxy.
rpc = "http://85.237.203.140:3383"
