# Hypersnap sample configuration
# This reflects the defaults used in the Docker image.
# Override any values via this file, environment variables (SNAPCHAIN_ prefix),
# or CLI flags.

rpc_address = "0.0.0.0:3383"
http_address = "0.0.0.0:3381"
# Seconds between attempts to refresh GetInfo size and FID totals.
info_stats_refresh_secs = 60
rocksdb_dir = ".rocks"
fc_network = "Mainnet"
# Role is inferred from the consensus key and validator schedule.

[statsd]
prefix = "snapchain"
addr = "127.0.0.1:8125"
use_tags = true

[gossip]
address = "/ip4/0.0.0.0/udp/3382/quic-v1"
# bootstrap_peers = "/ip4/..., /ip4/..."

[consensus]
shard_ids = [1, 2]
num_shards = 2

[hyper]
enabled = true
# retention_soft_cap = 500000  # Optional: alert on disk growth
# metrics_interval = "60s"

[api]
enabled = true

[api.social_graph]
enabled = true

[api.channels]
enabled = true

[api.metrics]
enabled = true

[api.feeds]
enabled = true

[api.conversations]
enabled = true

[snapshot]
endpoint_url = "https://5400535f796c891e31be1f53f6d89dc0.r2.cloudflarestorage.com"
s3_bucket = "snapshots"
snapshot_download_url = "https://snapshots.hypria.app"
backup_dir = ".rocks.backup"
load_db_from_snapshot = true
